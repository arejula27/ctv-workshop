name: ctv-workshop

services:
  bitcoind:
    build: ./bitcoind
    stop_grace_period: 1m # let bitcoind flush to disk on shutdown
    command: ["-rpcuser=${RPC_USER}", "-rpcpassword=${RPC_PASS}"]
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    ports:
      - "127.0.0.1:${RPC_DEBUG_PORT:-18543}:18443" # RPC only on localhost, for debugging
    # Fixed IP: electrs resolves "bitcoind" once at startup and never retries, so a
    # bitcoind that comes back with a new IP (e.g. Docker Desktop restart) would leave
    # esplora stuck on an old block.
    networks:
      default:
        ipv4_address: 10.231.0.10
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=${RPC_USER}", "-rpcpassword=${RPC_PASS}", "getblockcount"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  # Indexer + Esplora REST API. Reused from Nigiri (vulpemventures); it only
  # reads blocks over RPC, so it indexes CTV transactions like any other.
  electrs:
    image: ghcr.io/vulpemventures/electrs@sha256:999a2218f423c0fb167ee53b282aa7929a9d4abba38ef16f67f407acd00589d4 # latest on 2026-10-02
    entrypoint: ["/build/electrs"]
    command:
      - -vv
      - --network=regtest
      - --daemon-dir=/data
      - --db-dir=/data/db
      - --daemon-rpc-addr=bitcoind:18443
      - --cookie=${RPC_USER}:${RPC_PASS}
      - --http-addr=0.0.0.0:30000
      - --electrum-rpc-addr=0.0.0.0:50000
      - --jsonrpc-import
    volumes:
      - electrs-data:/data
    depends_on:
      bitcoind:
        condition: service_healthy
    restart: unless-stopped

  # Block explorer for projecting transactions: mempool.space, which draws the
  # transaction flow and decodes tapscripts (where OP_CHECKTEMPLATEVERIFY shows up).
  # Its backend reads blocks from our electrs (electrum protocol) and bitcoind.
  mempool-db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    environment:
      MYSQL_DATABASE: mempool
      MYSQL_USER: mempool
      MYSQL_PASSWORD: mempool # only reachable inside this network
      MYSQL_ROOT_PASSWORD: mempool
    volumes:
      - mempool-db:/var/lib/mysql
    restart: unless-stopped

  mempool-api:
    image: mempool/backend:v3.3.1@sha256:358c0a517c8dcf26e7f5c02447de5bab33ec7e3fa6318685cf8012ce36098e3a
    environment:
      MEMPOOL_NETWORK: regtest
      MEMPOOL_BACKEND: electrum
      MEMPOOL_POLL_RATE_MS: 2000
      ELECTRUM_HOST: electrs
      ELECTRUM_PORT: 50000
      ELECTRUM_TLS_ENABLED: "false"
      CORE_RPC_HOST: bitcoind
      CORE_RPC_PORT: 18443
      CORE_RPC_USERNAME: ${RPC_USER}
      CORE_RPC_PASSWORD: ${RPC_PASS}
      DATABASE_ENABLED: "true"
      DATABASE_HOST: mempool-db
      DATABASE_DATABASE: mempool
      DATABASE_USERNAME: mempool
      DATABASE_PASSWORD: mempool
      STATISTICS_ENABLED: "false"
      LIGHTNING_ENABLED: "false"
    depends_on: [electrs, mempool-db]
    restart: unless-stopped

  explorer:
    image: mempool/frontend:v3.3.1@sha256:0a162e7e0d26a01e9686ddf69c96c4beae5fe10b0daa1020f3d392e033c058f1
    environment:
      FRONTEND_HTTP_PORT: "8080"
      BACKEND_MAINNET_HTTP_HOST: mempool-api
    ports:
      - "${EXPLORER_PORT:-5000}:8080"
    depends_on: [mempool-api]
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
    environment:
      BITCOIND_RPC_URL: http://bitcoind:18443
      RPC_USER: ${RPC_USER}
      RPC_PASS: ${RPC_PASS}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      MINER_INTERVAL_S: ${MINER_INTERVAL_S:-30}
      MINER_PAUSED: ${MINER_PAUSED:-false}
      FAUCET_AMOUNT_SAT: ${FAUCET_AMOUNT_SAT:-1000000}
      FAUCET_COOLDOWN_S: ${FAUCET_COOLDOWN_S:-60}
      REGISTRY_PATH: /data/registry.json
      EXPLORER_URL: ${EXPLORER_URL:-}
    volumes:
      - server-data:/data
    depends_on:
      bitcoind:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv/web:ro
      - caddy-data:/data
    depends_on: [server, electrs]
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 10.231.0.0/24 # unusual, so it doesn't clash with other stacks

volumes:
  mempool-db:
  server-data:
  bitcoind-data:
  electrs-data:
  caddy-data:
